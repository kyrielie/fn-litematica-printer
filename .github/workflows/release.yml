name: Release FN Litematica Printer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0; leave empty to derive from tag or gradle.properties)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Attach Release JAR
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine mod version
        id: version
        shell: bash
        run: |
          RAW_VER="${{ inputs.version }}"

          if [ -z "$RAW_VER" ] && [ "${{ github.event_name }}" = "release" ]; then
            RAW_VER="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$RAW_VER" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VER="${{ github.ref_name }}"
          fi

          # Strip leading 'v'
          CLEAN_VER="${RAW_VER#v}"

          # Strip any existing Minecraft version suffix (e.g., 1.0.0+26.3 -> 1.0.0)
          CLEAN_VER="${CLEAN_VER%+*}"

          if [ -z "$CLEAN_VER" ]; then
            echo "No explicit version supplied, falling back to gradle.properties..."
            CLEAN_VER=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          fi

          echo "Target mod_version: $CLEAN_VER"
          echo "mod_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "tag_name=v$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew clean build -Pmod_version=${{ steps.version.outputs.mod_version }} --no-daemon

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            build/libs/fn-litematica-printer-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
